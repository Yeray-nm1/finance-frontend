name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: ESLINT_NO_PATCH=1 pnpm lint

      - run: pnpm test

      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      E2E_DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_e2e
      E2E_BACKEND_DIR: .e2e/backend

    steps:
      - uses: actions/checkout@v4

      # El backend es público: lo traemos para levantar la app completa
      # (frontend + API + Postgres efímero) sin usar ninguna base real.
      - uses: actions/checkout@v4
        with:
          repository: Yeray-nm1/finance-backend
          path: .e2e/backend

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .e2e/backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: .e2e/backend

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
